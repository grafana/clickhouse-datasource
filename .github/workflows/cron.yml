name: Scheduled Cloud E2E tests

on:
  # Run nightly against the shared Cloud instance
  schedule:
    - cron: '0 9 * * *' # Daily at 09:00 UTC

  # Allow engineers to run Cloud E2E on-demand (useful for debugging)
  workflow_dispatch:

# Reusable workflows can only narrow caller permissions, not escalate.
# `id-token: write` is needed by the Vault OIDC step in playwright-cloud.yml.
permissions:
  contents: read
  id-token: write

jobs:
  playwright-cloud:
    # Intentionally pinned to @main: data-sources-ci-workflows does not
    # publish versioned tags for this workflow yet. Allowed by the zizmor
    # policy (`grafana/*: any`); review periodically.
    uses: grafana/data-sources-ci-workflows/.github/workflows/playwright-cloud.yml@main
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      # This is the nightly Cloud E2E run, so label it with the DER run_stage vocabulary.
      run-stage: nightly
      # datasource-version is omitted here: the nightly tests whatever version is deployed
      # on the shared instance, so it defaults to the commit SHA. The in-Argo promotion
      # gate (generateBenchSuites) passes the real released version.
      pdc-network-name: datasources-pdc-network-aws-datasourcese2e
      repo-secrets: |
        DS_INSTANCE_HOST=ds-instance:host
        DS_INSTANCE_PASSWORD=ds-instance:password
        DS_INSTANCE_PORT=ds-instance:port
        DS_INSTANCE_USERNAME=ds-instance:username
