name: PR Title

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read

# No concurrency group on purpose. Renovate opens a PR and edits its body seconds
# later, so the opened and edited runs overlap. Cancelling one (or a queued one
# being replaced, with cancel-in-progress: false) leaves a `cancelled` check run on
# the commit, and Renovate counts the branch as pending until it's gone, so
# automerge never happens. The job takes seconds, so letting every run finish is cheap.

jobs:
  check-title:
    name: Validate Conventional Commits format
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allowed types. Keep aligned with https://www.conventionalcommits.org/
          # and with the changelog-sections in release-please-config.json.
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          # Require the subject to start with a lowercase letter.
          subjectPattern: ^[a-z].+$
          subjectPatternError: |
            The subject (after the "type:" prefix) must start with a lowercase letter.
            Example: "fix(traces): preserve trace-ID link optimization on cold cache"
