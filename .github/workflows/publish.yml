# Description:
# Thin caller for the shared datasource publish workflow. On a published release
# it publishes docs for the released tag; on manual dispatch it publishes the
# plugin. All logic lives in grafana/data-sources-ci-workflows.

name: Plugins - Publish plugin
run-name: Publish ${{ inputs.branch }} to ${{ inputs.environment }} by @${{ github.actor }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to publish from. Can be used to deploy PRs to dev
        default: main
      environment:
        description: Environment will always publish to all waves (dev + ops + prod). Cloud will publish scoped only to Grafana Cloud, On Prem will publish with Universal scope. Please use Cloud unless emergency fix needed for On Prem customer.
        required: true
        type: choice
        default: "cloud (recommended)"
        options:
          - "cloud (recommended)"
          - "on-prem (for emergencies fix to On Prem customers)"
      docs-only:
        description: Only publish docs, do not publish the plugin
        default: false
        type: boolean

permissions: {}

jobs:
  publish:
    name: Publish
    # Intentionally pinned to @main: data-sources-ci-workflows does not publish
    # versioned tags for datasource-publish.yml yet. Allowed by the zizmor policy
    # (`grafana/*: any`); review periodically.
    uses: grafana/data-sources-ci-workflows/.github/workflows/datasource-publish.yml@main # zizmor: ignore[unpinned-uses]
    permissions:
      contents: write
      id-token: write
      attestations: write
      pull-requests: read
    with:
      plugin-id: grafana-clickhouse-datasource
      # On a release event these dispatch inputs are empty and the shared
      # workflow's docs job reads github.event.release instead. On dispatch, the
      # environment choice maps to publishing scopes (Cloud vs On Prem/universal),
      # while the catalog environment is always prod.
      branch: ${{ github.event.inputs.branch }}
      environment: prod
      scopes: ${{ github.event.inputs.environment == 'cloud (recommended)' && 'grafana_cloud' || 'universal' }}
      docs-only: ${{ github.event.inputs.docs-only == 'true' }}
    secrets: inherit
