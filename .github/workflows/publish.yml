name: Plugins - CD
run-name: Deploy ${{ inputs.branch }} to ${{ inputs.environment }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to publish from. Can be used to deploy PRs to dev
        default: main
      environment:
        description: Environment will always publish to all waves (dev + ops + prod). Cloud will publish scoped only to Grafana Cloud, On Prem will publish with Universal scope. Please use Cloud unless emergency fix needed for On Prem customer.
        required: true
        type: choice
        default: "cloud (recommended)"
        options:
          - "cloud (recommended)"
          - "on-prem (for emergencies fix to On Prem customers)"
      docs-only:
        description: Only publish docs, do not publish the plugin
        default: false
        type: boolean
  # Auto-publish docs when release-please cuts a release. release-please creates
  # the release with the grafana-oss-big-tent token, so this event fires; the run
  # below is docs-only and mints the platform bot via the website-docs-release
  # grant keyed to this workflow (release-please.yml is never wired to that app).
  release:
    types: [published]

permissions: {}

jobs:
  cd:
    name: CD
    uses: grafana/plugin-ci-workflows/.github/workflows/cd.yml@ci-cd-workflows/v10.1.0
    permissions:
      contents: write
      id-token: write
      attestations: write
      pull-requests: read
    with:
      # On a release event there are no dispatch inputs: publish the release tag,
      # docs-only. Otherwise use the workflow_dispatch inputs as before.
      branch: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.branch }}
      environment: "prod"
      docs-only: ${{ github.event_name == 'release' || github.event.inputs.docs-only == 'true' }}
      scopes: ${{ github.event_name == 'release' && 'grafana_cloud' || (github.event.inputs.environment == 'cloud (recommended)' && 'grafana_cloud' || github.event.inputs.environment == 'on-prem (for emergencies fix to On Prem customers)' && 'universal') }}
      # Required so the release tag (vX.Y.Z) is accepted as a release reference for
      # prod docs publishing; main still matches for the manual dispatch path.
      # Anchored so a ref merely containing a match is not treated as a release.
      release-reference-regex: '^(main|v\d+\.\d+\.\d+)$'
      run-playwright: false
      github-draft-release: false
