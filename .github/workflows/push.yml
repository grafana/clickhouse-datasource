# Description:
# Thin caller for the shared datasource CI/CD pipeline. Most logic (CI on PRs,
# release-please + prod publish on release) lives in grafana/data-sources-ci-workflows.
# The dev-catalog publish stays a direct cd-dev.yml call here rather than being
# routed through the shared workflow, so the reusable-workflow chain stays within
# GitHub's 4-level nesting cap. It is gated on the shared workflow's release_created
# output so a Release Please merge (which cicd publishes to prod) does not also
# double-publish to the dev catalog.

name: Plugins - CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  cicd:
    name: CI/CD
    # Intentionally pinned to @main: data-sources-ci-workflows does not publish
    # versioned tags for datasource-cicd.yml yet. Allowed by the zizmor policy
    # (`grafana/*: any`); review periodically.
    uses: grafana/data-sources-ci-workflows/.github/workflows/datasource-cicd.yml@main # zizmor: ignore[unpinned-uses]
    permissions:
      contents: write
      id-token: write
      attestations: write
      pull-requests: read
    with:
      plugin-id: grafana-clickhouse-datasource
    secrets: inherit

  publish-dev:
    name: Publish to Dev Catalog and Deploy
    needs: cicd
    # Normal pushes to main (no release cut) publish the latest build to the dev
    # catalog. Skipped when release-please cut a release, since cicd already
    # publishes that version to prod (dev+ops+prod).
    if: github.ref == 'refs/heads/main' && needs.cicd.outputs.release_created != 'true'
    # Intentionally pinned to @main: data-sources-ci-workflows does not publish
    # versioned tags for cd-dev.yml yet. Allowed by the zizmor policy
    # (`grafana/*: any`); review periodically.
    uses: grafana/data-sources-ci-workflows/.github/workflows/cd-dev.yml@main # zizmor: ignore[unpinned-uses]
    permissions:
      attestations: write
      contents: write
      id-token: write
      pull-requests: read
    with:
      go-version: "1.26.5"
      golangci-lint-version: "2.10.1"
