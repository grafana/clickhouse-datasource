# Description:
# Thin caller for the shared datasource CI/CD pipeline in
# grafana/data-sources-ci-workflows, which owns release-please and the prod publish.
#
# CI is called directly rather than through the shared workflow. A called workflow
# prefixes its checks with the calling job's name, so routing CI through
# datasource-cicd.yml reports every check as "CI/CD / CI / <job>" instead of
# "CI / <job>". The branch rulesets require the two-segment names, so the deeper
# names leave the required checks permanently unreported and block every PR.
#
# The dev-catalog publish is also a direct cd-dev.yml call, so the
# reusable-workflow chain stays within GitHub's 4-level nesting cap. It is gated on
# the shared workflow's release_created output so a Release Please merge (which
# cicd publishes to prod) does not also double-publish to the dev catalog.

name: Plugins - CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: plugins-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: CI
    if: github.event_name == 'pull_request'
    uses: grafana/plugin-ci-workflows/.github/workflows/ci.yml@ci-cd-workflows/v11.1.1
    permissions:
      contents: read
      id-token: write
    with:
      # Ensure PR builds produce unique plugin versions.
      plugin-version-suffix: ${{ github.event.pull_request.head.sha }}

  cicd:
    name: CI/CD
    # Release path only. On pull requests every job in the shared workflow is
    # skipped, so it is not called at all and CI above is the only PR path.
    if: github.ref == 'refs/heads/main'
    # Intentionally pinned to @main: data-sources-ci-workflows does not publish
    # versioned tags for datasource-cicd.yml yet. Allowed by the zizmor policy
    # (`grafana/*: any`); review periodically.
    uses: grafana/data-sources-ci-workflows/.github/workflows/datasource-cicd.yml@main # zizmor: ignore[unpinned-uses]
    # These are a ceiling for the called workflow, not a grant to each of its jobs.
    # Every job there is guarded, and each declares its own permissions, which
    # cannot exceed this block.
    permissions:
      contents: write
      id-token: write
      attestations: write
      pull-requests: read
    secrets: inherit

  publish-dev:
    name: Publish to Dev Catalog
    needs: cicd
    # Normal pushes to main (no release cut) publish the latest build to the dev
    # catalog. Skipped when release-please cut a release, since cicd already
    # publishes that version to prod (dev+ops+prod).
    if: github.ref == 'refs/heads/main' && needs.cicd.outputs.release_created != 'true'
    # Intentionally pinned to @main: data-sources-ci-workflows does not publish
    # versioned tags for cd-dev.yml yet. Allowed by the zizmor policy
    # (`grafana/*: any`); review periodically.
    uses: grafana/data-sources-ci-workflows/.github/workflows/cd-dev.yml@main # zizmor: ignore[unpinned-uses]
    permissions:
      attestations: write
      contents: write
      id-token: write
      pull-requests: read
    with:
      go-version: '1.26.5'
      golangci-lint-version: '2.10.1'
      # The backend ships to dev0 per merge through the bundled pipeline
      # (bundled-image.yml), so this job publishes the frontend to the dev catalog
      # and does not also trigger the backend rollout.
      deploy: false
