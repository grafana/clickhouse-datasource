name: Renovate approve

# Sweeps open renovate PRs and approves the clear-cut ones, or the ones Claude
# clears, so Renovate can merge them. The gate itself is the shared workflow in
# grafana/data-sources-ci-workflows; this file only schedules it.
on:
  schedule:
    # Hourly on weekdays Mon-Thu, 07:23-17:23 UTC (about 08:23-18:23 Berlin in
    # winter), so an approval lands while someone is around to catch a bad one.
    - cron: '23 7-17 * * 1-4'
  workflow_dispatch:

permissions: {}

concurrency:
  group: renovate-approve
  cancel-in-progress: false

jobs:
  renovate-approve:
    # The called workflow's jobs narrow these per job. id-token: write is for
    # the GATB bot token and the Anthropic WIF exchange.
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
      actions: write
      id-token: write
    uses: grafana/data-sources-ci-workflows/.github/workflows/renovate-approve.yml@main # zizmor: ignore[unpinned-uses]
    with:
      anthropic-federation-rule-id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      anthropic-organization-id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      anthropic-service-account-id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
